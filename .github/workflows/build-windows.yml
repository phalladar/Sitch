name: Build (Windows)

on:
  push:
    branches: [main]
    paths: ['windows/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/build-windows.yml']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build windows/Sitch/Sitch.csproj
